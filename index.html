<title>Usina Canavial 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: cena isométrica em tela cheia, com cartões flutuantes (KPIs, etapa selecionada, fluxo, pátio) por cima. */
  :root {
    --bg: #0b0f12;
    --panel: rgba(15, 21, 25, 0.84);
    --panel-solid: #11181c;
    --line: rgba(190, 215, 225, 0.12);
    --fg: #e7eef1;
    --muted: #8fa0a9;
    --green: #22c55e;
    --orange: #fb923c;
    --yellow: #facc15;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 14px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  #app { position: relative; height: 100%; overflow: hidden; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #gl.drag { cursor: grabbing; }
  #tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  /* Etiquetas flutuantes sobre as etapas */
  .tag {
    position: absolute; left: 0; top: 0;
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 10px 5px 7px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    backdrop-filter: blur(6px);
    white-space: nowrap;
    will-change: transform;
    transition: border-color .15s, background .15s;
  }
  .tag:hover { border-color: rgba(34, 197, 94, .55); }
  .tag .tn { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .tag .tt { font-weight: 600; font-size: 12.5px; }
  .tag .tv { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); padding-left: 7px; border-left: 1px solid var(--line); }
  .tag.sel { border-color: var(--green); background: rgba(14, 40, 26, .9); }
  .tag.warn { border-color: rgba(251, 146, 60, .7); }
  .tag.warn.sel { background: rgba(52, 30, 14, .92); border-color: var(--orange); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
  .warn > .dot, .dot.warn { background: var(--orange); box-shadow: 0 0 0 0 rgba(251, 146, 60, .6); animation: pulse 1.8s infinite; }
  .dot.info { background: var(--yellow); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(251, 146, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(251, 146, 60, 0); } }

  /* HUD em grade */
  #hud {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: 44px 1fr minmax(0, 330px);
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "top top top" "tools layers panel" "flow flow trucks";
    gap: 12px;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; min-width: 0; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(10px);
  }

  .top { grid-area: top; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 14px; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand b { display: block; font-family: var(--font-display); font-size: 17px; line-height: 1.1; letter-spacing: .1px; }
  .brand small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .kpis { display: flex; gap: 8px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 1px; }
  .kpis::-webkit-scrollbar { display: none; }
  .kpi { display: flex; flex-direction: column; gap: 2px; padding: 8px 14px; border-radius: 12px; min-width: 128px; }
  .kpi span { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .kpi b { font-family: var(--font-mono); font-weight: 500; font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .kpi b i { font-style: normal; font-size: 11.5px; color: var(--muted); margin-left: 4px; }
  .live { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; }
  .alert {
    display: none; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid rgba(251, 146, 60, .55);
    background: rgba(52, 30, 14, .88);
    font-size: 12.5px; white-space: nowrap;
  }
  .alert.on { display: inline-flex; }

  .tools { grid-area: tools; align-self: center; display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 14px; width: 44px; }
  .tools button {
    width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent;
    display: grid; place-items: center; color: var(--fg);
  }
  .tools button:hover { background: rgba(255, 255, 255, .08); }
  .tools svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .panel { grid-area: panel; align-self: start; padding: 16px; display: flex; flex-direction: column; gap: 14px; max-height: 100%; overflow: auto; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .p-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .p-head h2 { margin: 3px 0 0; font-family: var(--font-display); font-size: 22px; line-height: 1.15; text-wrap: balance; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid rgba(34, 197, 94, .4); background: rgba(34, 197, 94, .1); white-space: nowrap; }
  .pill.warn { border-color: rgba(251, 146, 60, .5); background: rgba(251, 146, 60, .12); }
  .desc { margin: 0; color: var(--muted); line-height: 1.45; text-wrap: pretty; }
  .inds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ind { padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); min-width: 0; }
  .ind span { display: block; color: var(--muted); font-size: 11.5px; }
  .ind b { display: block; margin-top: 3px; font-family: var(--font-mono); font-weight: 500; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ind b i { font-style: normal; font-size: 11px; color: var(--muted); margin-left: 4px; }
  .ind.hot { border-color: rgba(251, 146, 60, .6); background: rgba(251, 146, 60, .08); }
  .ind.hot b { color: var(--orange); }
  .spark-wrap { display: flex; flex-direction: column; gap: 6px; }
  .spark-top span:last-child { white-space: nowrap; }
  .spark-top { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; gap: 8px; }
  .spark { position: relative; height: 64px; border-radius: 10px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); }
  .spark svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .spark .end { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--green); border: 2px solid var(--panel-solid); transform: translate(-50%, -50%); }
  .spark.hot .end { background: var(--orange); }
  .nav { display: flex; gap: 8px; }
  .nav button { flex: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); font-size: 12.5px; }
  .nav button:hover { border-color: rgba(34, 197, 94, .55); }
  .credit { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.4; }

  .flow { grid-area: flow; align-self: end; justify-self: start; display: flex; align-items: center; gap: 2px; padding: 8px; border-radius: 14px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .flow::-webkit-scrollbar { display: none; }
  .step { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; border: 1px solid transparent; background: transparent; white-space: nowrap; }
  .step:hover { background: rgba(255, 255, 255, .06); }
  .step.sel { background: rgba(34, 197, 94, .12); border-color: rgba(34, 197, 94, .45); }
  .step.warn.sel { background: rgba(251, 146, 60, .12); border-color: rgba(251, 146, 60, .5); }
  .step .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .step .t { font-size: 12.5px; font-weight: 500; }
  .arrow { width: 18px; height: 14px; flex: none; fill: none; stroke: var(--green); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .trucks { grid-area: trucks; align-self: end; padding: 12px 14px; border-radius: 14px; }
  .trucks h3 { margin: 0 0 8px; display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; }
  .trucks h3 span { color: var(--muted); font-weight: 400; }
  .trucks table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .trucks td { padding: 5px 0; border-top: 1px solid var(--line); white-space: nowrap; }
  .trucks td:first-child { font-family: var(--font-mono); font-size: 12px; }
  .trucks td:nth-child(2) { color: var(--muted); padding: 5px 10px; }
  .trucks td:last-child { text-align: right; }
  .trucks td:last-child .dot { display: inline-block; margin-right: 6px; vertical-align: 0; }

  #nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); line-height: 1.5; }

  @media (max-width: 860px) {
    #hud { grid-template-columns: 44px 1fr; grid-template-rows: auto 1fr auto; grid-template-areas: "top top" "tools layers" "panel panel"; gap: 10px; }
    .flow, .trucks, .credit, .desc { display: none; }
    .top { gap: 8px; }
    .kpis { order: 3; flex-basis: 100%; }
    .kpi { min-width: 116px; padding: 7px 12px; }
    .live { margin-left: auto; }
    .panel { padding: 12px 14px; gap: 10px; max-height: 44vh; }
    .p-head h2 { font-size: 19px; }
    .spark { height: 48px; }
    .tag .tv { display: none; }
    .tag { padding: 4px 9px 4px 6px; }
    .tag .tt { font-size: 11.5px; }
  }
  @media (max-width: 520px) {
    .brand small { display: none; }
    .tag .tn { display: none; }
    .alert.on { order: 4; }
  }
  @media (prefers-reduced-motion: reduce) {
    .warn > .dot, .dot.warn { animation: none; }
  }

  /* acabamento: etiquetas limpas, vinheta, entrada suave */
  .tag .tv { display: none; }
  .tag.sel .tv, .tag:hover .tv { display: inline; }
  .tag::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 14px; background: linear-gradient(rgba(190, 215, 225, .5), rgba(190, 215, 225, 0)); }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 45% 50%, transparent 55%, rgba(4, 7, 9, .55) 100%); }
  @media (max-width: 860px) { .tag.sel .tv, .tag:hover .tv { display: none; } }
  @media (prefers-reduced-motion: no-preference) {
    .top, .tools, .panel, .flow, .trucks { animation: fadein .9s .6s both; }
    @keyframes fadein { from { opacity: 0; } }
  }

  /* camadas e tour */
  .layers { grid-area: layers; align-self: end; justify-self: start; padding: 8px; border-radius: 14px; display: flex; flex-direction: column; gap: 8px; max-width: 100%; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid transparent; background: transparent; font-size: 12.5px; white-space: nowrap; }
  .chip:hover { background: rgba(255, 255, 255, .06); }
  .chip[aria-pressed="true"] { background: rgba(34, 197, 94, .14); border-color: rgba(34, 197, 94, .45); }
  .tourbtn { margin-left: 6px; border-color: var(--line); display: inline-flex; align-items: center; gap: 6px; }
  .tourbtn svg { width: 12px; height: 12px; fill: currentColor; }
  .legend { display: flex; align-items: center; gap: 8px; padding: 0 6px 2px; font-size: 11.5px; color: var(--muted); }
  .legend i { width: 120px; height: 8px; border-radius: 99px; background: var(--leg, #2f9e63); flex: none; }
  #tags.showval .tag .tv { display: inline; }
  .caption { position: absolute; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(660px, calc(100% - 32px)); padding: 16px 18px; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; z-index: 5; }
  .capTxt { font-family: var(--font-display); font-size: 20px; line-height: 1.3; text-wrap: balance; }
  .capRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .dots i { width: 22px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .16); }
  .dots i.on { background: var(--green); }
  .dots i.done { background: rgba(34, 197, 94, .45); }
  #capStop { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); font-size: 12.5px; white-space: nowrap; }
  #app.tour .panel, #app.tour .flow, #app.tour .trucks, #app.tour .tools, #app.tour .layers, #app.tour .kpis, #app.tour .alert { visibility: hidden; }
  @media (max-width: 860px) {
    .layers { max-width: 100%; justify-self: stretch; align-self: start; }
    .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { padding: 5px 9px; font-size: 12px; }
    .tourbtn { margin-left: 0; }
    #tags.showval .tag .tv { display: none; }
    .capTxt { font-size: 16px; }
    .caption { bottom: 12px; }
  }
</style>

<div id="app">
  <canvas id="gl" aria-label="Vista isométrica 3D da usina. Arraste para mover, use a roda do mouse para aproximar."></canvas>
  <div id="vig"></div>
  <div class="caption card" id="cap" hidden><div class="capTxt" id="capTxt"></div><div class="capRow"><div class="dots" id="capDots"></div><button type="button" id="capStop">Parar tour</button></div></div>
  <div id="tags"></div>
  <div id="nogl" hidden>Seu navegador não conseguiu abrir a vista 3D (WebGL indisponível). Tente outro navegador ou ative a aceleração de hardware.</div>

  <div id="hud">
    <header class="top">
      <div class="brand card">
        <svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#14391f"/><path d="M11 26 L16 8 M17 27 L22 9 M23 26 L27 12" stroke="#22c55e" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M9 17 L25 14" stroke="#facc15" stroke-width="2" stroke-linecap="round"/></svg>
        <div><b>Usina Canavial</b><small>Safra 2026/27 · Ibiporã - PR</small></div>
      </div>
      <div class="kpis" id="kpis"></div>
      <button class="alert" id="alert" type="button"><span class="dot warn"></span><span id="alertTxt"></span></button>
      <div class="live card"><span class="dot"></span><span id="srcTxt">Exemplo</span> · <span id="clock">--:--:--</span></div>
    </header>

    <nav class="tools card" aria-label="Controles da câmera">
      <button id="rotL" type="button" aria-label="Girar para a esquerda"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>
      <button id="rotR" type="button" aria-label="Girar para a direita"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg></button>
      <button id="zIn" type="button" aria-label="Aproximar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zOut" type="button" aria-label="Afastar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="night" type="button" aria-label="Alternar modo noite" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button id="home" type="button" aria-label="Ver a usina inteira"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg></button>
    </nav>

    <aside class="panel card" id="panel" aria-live="polite">
      <div>
        <div class="p-head">
          <div><div class="eyebrow" id="pStep"></div><h2 id="pName"></h2></div>
          <span class="pill" id="pStatus"></span>
        </div>
      </div>
      <p class="desc" id="pDesc"></p>
      <div class="inds" id="pInds"></div>
      <div class="spark-wrap">
        <div class="spark-top"><span id="spLabel"></span><span id="spLimit"></span></div>
        <div class="spark" id="spark"><svg viewBox="0 0 200 64" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient></defs><line id="spLim" x1="0" x2="200" stroke="#fb923c" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke" opacity="0"/><path id="spArea" fill="url(#sg)"/><polyline id="spLine" fill="none" stroke="#22c55e" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><div class="end" id="spEnd"></div></div>
      </div>
      <div class="nav"><button type="button" id="prev">← Etapa anterior</button><button type="button" id="next">Próxima etapa →</button></div>
      <p class="credit"><span id="srcNote">Dados fictícios de demonstração, gerados no navegador.</span> Vista 3D inspirada no conceito de Dilum Sanjaya.</p>
    </aside>

    <section class="layers card" aria-label="Camadas de dados">
      <div class="chips" role="group" aria-label="Camada exibida">
        <button class="chip" type="button" data-layer="op" aria-pressed="true">Operação</button>
        <button class="chip" type="button" data-layer="temp" aria-pressed="false">Temperatura</button>
        <button class="chip" type="button" data-layer="prod" aria-pressed="false">Produção</button>
        <button class="chip" type="button" data-layer="alert" aria-pressed="false">Alertas</button>
        <button class="chip tourbtn" type="button" id="tourBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>Tour</button>
      </div>
      <div class="legend" id="legend" hidden><i id="legBar"></i><span id="legA"></span><span id="legB"></span></div>
    </section>

    <nav class="flow card" id="flow" aria-label="Fluxo do processo"></nav>

    <section class="trucks card" aria-label="Pátio de caminhões">
      <h3>Pátio <span id="yardCount"></span></h3>
      <table><tbody id="yard"></tbody></table>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const fmt = (v, d = 0) => v.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- Dados de exemplo (fictícios) ---------- */
  const STAGES = [
    { id: 'moagem', nome: 'Recepção e moagem', curto: 'Moagem', pos: [-14, -2], top: 8.4, spark: 2,
      desc: 'A cana chega em caminhões, é pesada, lavada e esmagada nas moendas para extrair o caldo.',
      ind: [
        { k: 'Moagem hoje', u: 't', v: 67399, d: 0, step: 4 },
        { k: 'Fila de recepção (simulado)', u: 'caminhões', v: 0, d: 0 },
        { k: 'ATR médio', u: 'kg/t', v: 138.2, d: 1, n: 0.28 },
        { k: 'Extração', u: '%', v: 96.1, d: 1, n: 0.08 } ] },
    { id: 'caldo', nome: 'Tratamento do caldo', curto: 'Caldo', pos: [-2.1, -8.5], top: 6.2, spark: 0,
      desc: 'O caldo é peneirado, aquecido e decantado para retirar impurezas antes de seguir para a fermentação.',
      ind: [
        { k: 'Brix do caldo', u: '°Bx', v: 18.4, d: 1, n: 0.14 },
        { k: 'pH', u: '', v: 5.6, d: 2, n: 0.03 },
        { k: 'Temperatura', u: '°C', v: 82, d: 0, n: 0.6 },
        { k: 'Vazão', u: 'm³/h', v: 1240, d: 0, n: 9 } ] },
    { id: 'fermentacao', nome: 'Fermentação', curto: 'Fermentação', pos: [10, -2.8], top: 9.4, spark: 0, limit: 33, limitTxt: 'limite 33 °C',
      desc: 'As leveduras transformam o açúcar do caldo em álcool dentro das dornas. A temperatura precisa ficar controlada.',
      ind: [
        { k: 'Temperatura da dorna 3', u: '°C', v: 34.1, d: 1, n: 0.12 },
        { k: 'Teor alcoólico', u: '°GL', v: 8.7, d: 1, n: 0.05 },

    if (warn) { const u = (now % 1800) / 1800; beacon.scale.setScalar(0.92 + u * 0.28); beacon.material.opacity = still ? 0.7 : 0.85 * (1 - u); }
    const lv = layer !== 'op'; let vi = 0;
    for (const id in vols) {
      const v = vols[id]; v.g.visible = lv; vi++; if (!lv) continue;
      v.col.lerp(v.target, 0.12); v.m.material.color.copy(v.col); v.pad.material.color.copy(v.col); v.e.material.color.copy(v.col).multiplyScalar(1.5);
      v.m.material.opacity = 0.13 + (still ? 0.02 : 0.04 * Math.sin(now / 420 + vi));
    }
    acc += dt; accY += dt;
    if (acc > 2.5 && !still) { acc = 0; tickData(); renderLive(); }
    if (accY > 0.5) { accY = 0; renderYard(); }
    const n = new Date(); $('#clock').textContent = n.toLocaleTimeString('pt-BR');
    renderer.render(scene, camera); placeTags();
    requestAnimationFrame(frame);
  }
  /* ---------- API (consulta a cada 10 s, com fallback para o exemplo) ---------- */
  const getJson = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
  function applyApi(et, kp, cn, hs) {
    const E = (nome) => et.find((e) => e.etapa === nome), K = (id) => kp.find((k) => k.indicador === id);
    const put = (s, n, v, k, u) => { const i = s.ind[n]; if (v != null) i.v = v; if (k) i.k = k; if (u != null) i.u = u; };
    const ev = (e, nome) => { for (let n = 1; n <= 4; n++) if (e['ind' + n] === nome) return { v: e['val' + n], u: e['un' + n] }; return {}; };
    const m = E('Recepção e moagem'), c = E('Tratamento do caldo'), f = E('Fermentação'), d = E('Destilação'), x = E('Expedição');
    put(byId.moagem, 0, K('moagem').valor); put(byId.moagem, 2, K('atr').valor); put(byId.moagem, 3, ev(m, 'Extração').v);
    put(byId.caldo, 0, ev(c, 'Brix médio').v); put(byId.caldo, 1, ev(c, 'pH do caldo').v); put(byId.caldo, 2, ev(c, 'Temperatura').v); put(byId.caldo, 3, ev(c, 'Vazão').v);
    put(byId.fermentacao, 0, cn.dornas['3']); put(byId.fermentacao, 1, ev(f, 'Teor alcoólico').v);
    put(byId.fermentacao, 2, ev(f, 'Dornas ativas').v, null, 'un'); put(byId.fermentacao, 3, ev(f, 'Tempo de ciclo').v);
    put(byId.destilacao, 0, K('etanol').valor); put(byId.destilacao, 1, ev(d, 'Pureza do hidratado').v, 'Pureza', '°GL');
    put(byId.destilacao, 2, cn.etapas.destilacao.temperatura); put(byId.destilacao, 3, ev(d, 'Consumo de vapor').v, 'Consumo de vapor', 't/m³');
    byId.destilacao.ind[3].d = 1;
    put(byId.expedicao, 0, ev(x, 'Etanol em tanque').v); put(byId.expedicao, 2, ev(x, 'Caminhões carregados').v, 'Cargas hoje', '');
    put(byId.expedicao, 3, ev(x, 'Açúcar VHP').v, 'Açúcar VHP', 't');
    STAGES.forEach((s) => {
      s.alerts = cn.etapas[s.id].alertas;
      const serie = (hs.series[s.id] || []).slice(-30).map((p) => p.v);
      if (serie.length >= 2) s.hist = serie;
    });
    cena = cn.etapas; cenaAlertas = cn.alertas;
  }
  function setSource(ok) {
    apiOk = ok;
    $('#srcTxt').textContent = ok ? 'Ao vivo · API' : 'Exemplo (sem API)';
    $('#srcNote').textContent = ok ? 'Dados fictícios gerados pelo simulador da usina (API local). Pátio de caminhões simulado no navegador.' : 'Dados fictícios de demonstração, gerados no navegador.';
  }
  function poll() {
    Promise.all([getJson('/api/etapas'), getJson('/api/kpis'), getJson('/api/cena'), getJson('/api/historico?minutos=5')])
      .then(([et, kp, cn, hs]) => { applyApi(et, kp, cn, hs); setSource(true); })
      .catch(() => { if (apiOk) STAGES.forEach((s) => { s.alerts = undefined; }); setSource(false); })
      .then(() => renderLive());
  }
  poll(); setInterval(poll, 10000);
  requestAnimationFrame(frame);
})();
</script>
